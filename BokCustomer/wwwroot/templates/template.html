<div class="document">

	<div class="header">
		<div class="logo" data-ref="Document.Title">Analisi Documenti</div>
		<div class="subtitle" data-ref="Document.Subtitle">Rel 1.5</div>
	</div>

	<div class="checklist" data-type="table" data-table="Checklist.Items">
		<div class="checklist-headers">
			<div class="header-cell" data-ref="Column.Number">Punto</div>
			<div class="header-cell" data-ref="Column.Question">Domanda</div>
			<div class="header-cell" data-ref="Column.Status">Stato</div>
			<div class="header-cell" data-ref="Column.Notes">Note</div>
			<div class="header-cell" data-ref="Column.Error">Messaggio di Errore</div>
			<div class="header-cell" data-ref="Column.Agent">Agente</div>
			<div class="header-cell" data-ref="Column.Steps">Step</div>
		</div>

		<div class="checklist-rows" data-array="Checklist.Items"></div>

		<!-- Row template for each checklist item -->
		<template id="tmpl-Checklist.Items">
			<div class="checklist-row" data-seq="#">
				<div class="cell number" data-key="Number"></div>
				<div class="cell question" data-key="Title"></div>
				<div class="cell status" data-key="Status"></div>
				<div class="cell notes" data-key="Notes"></div>
				<div class="cell error" data-key="Error"></div>
				<div class="cell agent" data-key="Agent"></div>
				<div class="cell steps" data-key="Steps"></div>

				<!-- Sub-items (es. 1.1, 2.1, ecc.) -->
				<div class="subitems" data-type="table" data-table="SubItems">
					<div class="subitems-header">
						<div class="subheader-cell" data-ref="SubColumn.Number">Sub</div>
						<div class="subheader-cell" data-ref="SubColumn.Question">Domanda</div>
						<div class="subheader-cell" data-ref="SubColumn.Status">Stato</div>
						<div class="subheader-cell" data-ref="SubColumn.Notes">Note</div>
					</div>				
					<div class="subitems-rows" data-array="SubItems"></div>
					<template id="tmpl-SubItems">
						<div class="subitem" data-seq="#">
							<div class="subcell number" data-key="Number"></div>
							<div class="subcell question" data-key="Title"></div>
							<div class="subcell status" data-key="Status"></div>
							<div class="subcell notes" data-key="Notes"></div>
						</div>
					</template>
				</div>
			</div>
		</template>
	</div>
</div>
